name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: app/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: app/ui/pnpm-lock.yaml
      - name: Check formatting and shell syntax
        run: |
          test -z "$(gofmt -l app)"
          for file in scripts/*.sh packaging/cmd/*; do sh -n "$file"; done
      - name: Test backend with race detector
        working-directory: app
        run: go test -race -count=3 -timeout 180s ./...
      - name: Vet backend
        working-directory: app
        run: go vet ./...
      - name: Verify UI and version
        run: |
          pnpm --dir app/ui install --frozen-lockfile
          pnpm --dir app/ui test
          pnpm --dir app/ui build
          version=$(awk -F= '/^version[[:space:]]*=/{gsub(/[[:space:]]/, "", $2); print $2}' packaging/manifest)
          test "$version" = "$(node -p "JSON.parse(require('fs').readFileSync('app/ui/package.json')).version")"

  package:
    needs: verify
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: app/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: app/ui/pnpm-lock.yaml
      - name: Install official fnpack
        run: |
          sh scripts/install-fnpack.sh "$RUNNER_TEMP/fnpack-sdk"
          echo "$RUNNER_TEMP/fnpack-sdk" >> "$GITHUB_PATH"
      - name: Build native package
        run: sh scripts/build.sh '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v6
        with:
          name: fpk-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/*.fpk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [verify, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Allow releases only from main with matching version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          version=$(awk -F= '/^version[[:space:]]*=/{gsub(/[[:space:]]/, "", $2); print $2}' packaging/manifest)
          test "$RELEASE_TAG" = "v$version"
      - uses: actions/download-artifact@v7
        with:
          pattern: fpk-*
          path: dist
          merge-multiple: true
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum --check ./*.sha256)
          gh release create "$RELEASE_TAG" dist/*.fpk dist/*.sha256 --verify-tag --title "$RELEASE_TAG" --generate-notes
